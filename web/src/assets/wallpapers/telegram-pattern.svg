<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <pattern id="tg-doodles" width="200" height="200" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#7a9a62" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.22">
        <!-- cat -->
        <g transform="translate(18 22) scale(0.9)">
          <path d="M4 14 L4 8 Q4 2 10 2 L14 2 Q20 2 20 8 L20 14 Q20 20 14 20 L10 20 Q4 20 4 14 Z"/>
          <path d="M4 6 L2 0 M20 6 L22 0"/>
          <circle cx="9" cy="10" r="1.2" fill="#7a9a62" stroke="none"/>
          <circle cx="15" cy="10" r="1.2" fill="#7a9a62" stroke="none"/>
          <path d="M10 14 Q12 16 14 14"/>
        </g>
        <!-- coffee cup -->
        <g transform="translate(118 16) scale(0.85)">
          <path d="M4 8 L4 18 Q4 22 8 22 L16 22 Q20 22 20 18 L20 8 Z"/>
          <path d="M20 10 Q26 10 26 14 Q26 18 20 18"/>
          <path d="M6 6 Q12 4 18 6" opacity="0.7"/>
        </g>
        <!-- balloon -->
        <g transform="translate(62 8) scale(0.8)">
          <ellipse cx="12" cy="10" rx="8" ry="10"/>
          <path d="M12 20 L12 26 M12 26 L10 28"/>
        </g>
        <!-- burger -->
        <g transform="translate(158 72) scale(0.75)">
          <path d="M2 8 Q12 4 22 8"/>
          <path d="M2 12 L22 12"/>
          <path d="M2 16 Q12 20 22 16"/>
          <path d="M2 10 L22 10 M2 14 L22 14"/>
        </g>
        <!-- cloud -->
        <g transform="translate(8 88) scale(0.7)">
          <path d="M6 16 Q2 16 2 12 Q2 8 6 8 Q6 4 12 4 Q18 4 18 8 Q22 8 22 12 Q22 16 18 16 Z"/>
        </g>
        <!-- rocket -->
        <g transform="translate(88 78) scale(0.7)">
          <path d="M12 2 Q16 10 12 22 Q8 10 12 2 Z"/>
          <path d="M8 16 L4 22 M16 16 L20 22"/>
          <circle cx="12" cy="10" r="2"/>
        </g>
        <!-- heart -->
        <g transform="translate(148 128) scale(0.65)">
          <path d="M12 20 C12 20 2 14 2 8 Q2 4 6 4 Q10 4 12 8 Q14 4 18 4 Q22 4 22 8 Q22 14 12 20 Z"/>
        </g>
        <!-- music note -->
        <g transform="translate(28 138) scale(0.7)">
          <ellipse cx="6" cy="18" rx="4" ry="3"/>
          <path d="M10 18 L10 4"/>
          <path d="M10 4 Q16 2 18 6 L18 14"/>
          <ellipse cx="18" cy="16" rx="3" ry="2.5"/>
        </g>
        <!-- pineapple -->
        <g transform="translate(168 168) scale(0.6)">
          <path d="M12 10 L12 24 Q12 28 8 28 Q4 28 4 24 L4 14 Q4 10 8 10 Z"/>
          <path d="M8 10 Q12 4 16 10"/>
          <path d="M6 6 L8 2 M12 4 L12 0 M16 6 L14 2"/>
          <path d="M6 16 L10 16 M6 20 L10 20 M6 24 L10 24" stroke-width="0.8"/>
        </g>
        <!-- duck -->
        <g transform="translate(72 148) scale(0.65)">
          <ellipse cx="14" cy="16" rx="10" ry="8"/>
          <circle cx="20" cy="12" r="5"/>
          <path d="M24 12 L28 11 L24 14 Z" fill="#7a9a62" stroke="none" opacity="0.22"/>
          <path d="M6 20 Q2 22 4 24"/>
        </g>
        <!-- star -->
        <g transform="translate(128 168) scale(0.5)">
          <path d="M12 0 L14.5 9 L24 9 L16.5 14.5 L19 24 L12 18.5 L5 24 L7.5 14.5 L0 9 L9.5 9 Z"/>
        </g>
        <!-- camera -->
        <g transform="translate(12 178) scale(0.6)">
          <rect x="4" y="8" width="20" height="14" rx="2"/>
          <circle cx="14" cy="15" r="4"/>
          <path d="M8 8 L10 4 L18 4 L20 8"/>
        </g>
      </g>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#tg-doodles)"/>
</svg>
