# Security CI: secrets, SAST, dependency audit, Trivy (filesystem + Docker image).
#
# Code Scanning (SARIF upload) is disabled — not available without GHAS on private repos.
# Dependency Review is also omitted (requires GHAS on private repos; free on public).
# Scans run with text/table output in CI logs instead.
#
# PR: fast checks (no image build).
# push main + weekly: full scan including API Docker image (same Dockerfile as prod).
#
# npm audit: fails on CRITICAL (--omit=dev for server/web/mobile prod deps).

name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@2898cb650e2017326bceea0cbfaab071c4c83fb0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install setuptools 'semgrep==1.166.0'

      - name: Semgrep scan
        run: |
          semgrep scan \
            --config p/javascript \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/secrets \
            --text \
            --error \
            .

  dependencies:
    name: Dependencies (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: server
            install_flags: ''
            omit_dev: true
          - dir: mobile
            install_flags: '--legacy-peer-deps'
            omit_dev: true
          - dir: web
            install_flags: ''
            omit_dev: true
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - uses: actions/setup-node@5e21ff4d9bc1a8cf6de233a3057d20ec6b3fb69d
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        run: npm ci ${{ matrix.install_flags }}

      - name: npm audit (fail on critical, production deps)
        shell: bash
        run: |
          if [ "${{ matrix.omit_dev }}" = "true" ]; then
            npm audit --omit=dev --audit-level=critical
          else
            npm audit --audit-level=critical
          fi

      - name: npm audit report (high — informational)
        shell: bash
        run: |
          if [ "${{ matrix.omit_dev }}" = "true" ]; then
            npm audit --omit=dev --audit-level=high || true
          else
            npm audit --audit-level=high || true
          fi

  trivy-fs:
    name: Trivy filesystem (server/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Scan server tree
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: server/
          severity: CRITICAL
          exit-code: '1'
          format: table

  trivy-image:
    name: Trivy Docker image (API)
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Build API image (prod Dockerfile)
        run: docker build -f server/Dockerfile -t chatus-api:ci .

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: chatus-api:ci
          severity: CRITICAL
          exit-code: '1'
          format: table
          # Bookworm ships zlib CVE-2023-45853 as will_not_fix; skip unfixed OS CVEs.
          ignore-unfixed: true
