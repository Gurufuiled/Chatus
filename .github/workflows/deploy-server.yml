# Деплой NestJS API (Docker Compose service `api`) на прод по SSH.
#
# Настройка GitHub (репозиторий → Settings → Secrets and variables → Actions):
#   Secrets:
#     DEPLOY_HOST       — IP или хост VPS (например teklxqggzl или 1.2.3.4)
#     DEPLOY_USER       — SSH-пользователь (например root)
#     DEPLOY_SSH_KEY    — приватный SSH-ключ (полный PEM), пара к ключу в authorized_keys на сервере
#
#   Variables (не секреты, удобно править в UI):
#     DEPLOY_REPO_DIR    — каталог с git clone (git pull здесь). По умолчанию: /root/chatus
#     DEPLOY_COMPOSE_DIR — каталог с docker-compose.yml. По умолчанию: /root/chatus/server
#
# На сервере отдельно нужен deploy key или SSH-доступ к GitHub для `git pull` (см. ранее в переписке).
#
# Ручной деплой без новых коммитов в server/: вкладка Actions → «Deploy server (API)» → Run workflow (workflow_dispatch).
# Пуш в этот файл на main тоже запускает job (git pull подтянет весь монорепозиторий, включая mobile).
#
name: Deploy server (API)

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

concurrency:
  group: deploy-chatus-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # В выражениях if: нельзя ссылаться на secrets (ни у job, ни у step) — workflow будет invalid.
      # Проверяем наличие секретов в shell через env и выставляем output для условного шага деплоя.
      - name: Check deploy secrets
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_HOST" ] && [ -n "$DEPLOY_USER" ] && [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Add DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY in repository Actions secrets to enable deploy."
          fi

      - name: Deploy over SSH
        if: steps.gate.outputs.deploy == 'true'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897ac1a227ba46d4e5
        env:
          REPO_DIR: ${{ vars.DEPLOY_REPO_DIR || '/root/chatus' }}
          COMPOSE_DIR: ${{ vars.DEPLOY_COMPOSE_DIR || '/root/chatus/server' }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: REPO_DIR,COMPOSE_DIR
          script: |
            set -euo pipefail
            cd "$REPO_DIR"
            git pull origin main
            cd "$COMPOSE_DIR"
            FA_KEY="$COMPOSE_DIR/firebase-service-account.json"
            if [ -d "$FA_KEY" ]; then
              rm -rf "$FA_KEY"
              echo "Removed mistaken firebase-service-account.json directory (Docker bind-mount footgun)."
            fi
            if [ ! -f "$FA_KEY" ]; then
              echo "::warning title=FCM disabled::firebase-service-account.json missing in $COMPOSE_DIR — scp the key from Firebase Console before next deploy (Android FCM direct push off until present)."
            fi
            # Traefik (Павел) подключается к той же external-сети; до его установки создаём сеть, чтобы compose up не падал.
            docker network inspect traefik-public >/dev/null 2>&1 || docker network create traefik-public
            docker compose build api
            docker compose up -d api
            docker compose ps api
            docker compose logs api --tail 25
