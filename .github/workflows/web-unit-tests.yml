name: Web unit tests

on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web-unit-tests.yml'
  pull_request:
    paths:
      - 'web/**'

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4.0.0
      - uses: actions/setup-node@v4.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
