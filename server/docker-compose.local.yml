# Local override: avoid Windows excluded UDP 50000-50100; no Traefik network needed.
services:
  livekit:
    volumes:
      - ./livekit.local.yaml:/etc/livekit.yaml:ro
    ports:
      - '127.0.0.1:7880:7880'
      - '127.0.0.1:7881:7881'
      - '51000-51100:51000-51100/udp'
    networks:
      - default
    # Drop traefik-public for local (external network may be absent / unused)
    labels: []

  db:
    networks:
      - default
