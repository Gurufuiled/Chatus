# LiveKit self-hosted config (local dev / VPS draft)
# Keys must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in server .env

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false

keys:
  devkey: devsecret_change_me_in_production

room:
  empty_timeout: 300
  max_participants: 30

logging:
  level: info

# TURN (coturn) — configure on VPS for production NAT traversal
# turn:
#   enabled: true
#   domain: messenger.startapus.com
#   tls_port: 5349
#   udp_port: 3478
#   external_tls: true

webhook:
  api_key: devkey
  urls:
    - http://api:4000/api/livekit/webhook
