# LiveKit local Windows — UDP вне excluded port range Hyper-V (см. netsh excludedportrange)
port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 60000
  port_range_end: 60020
  use_external_ip: false

keys:
  devkey: devsecret_change_me_in_production

room:
  empty_timeout: 300
  max_participants: 30

logging:
  level: info

webhook:
  api_key: devkey
  urls:
    - http://api:4000/api/livekit/webhook
